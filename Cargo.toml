[package]
name = "oca-sdk-rs"
version = "2.0.0-rc1"
edition = "2021"
license = "EUPL-1.2"
readme = "README.md"
description = "Comprehensive SDK for OCA Bundle management and integration"

[dependencies]
lazy_static = "1.5.0"
oca-ast = { version = "2.0.0-rc.2" }
oca-bundle= { version = "2.0.0-rc.4" }
oca-store = { version = "2.0.0-rc.2", features = ["local-references"] }
overlay-file = { version = "1.0.0-rc.2" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
transformation-file = { version = "0.7.1" }
