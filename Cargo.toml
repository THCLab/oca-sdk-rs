[package]
name = "oca-sdk-rs"
version = "0.2.0"
edition = "2021"
license = "EUPL-1.2"
readme = "README.md"
description = "Comprehensive SDK for OCA Bundle management and integration"

[dependencies]
lazy_static = "1.5.0"
oca-ast = { version = "2.0.0-rc2", path = "../oca-rs/oca-ast" }
oca-bundle= { version = "2.0.0-rc2", path = "../oca-rs/oca-bundle" }
oca-rs = { version = "0.7.1" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
transformation-file = { version = "0.7.1" }
